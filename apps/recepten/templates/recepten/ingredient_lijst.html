{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
  <h2>Ingrediënten lijst</h2>
  <a href="{% url 'recepten:ingredient_invoer' %}" class="btn btn-success mb-3">Nieuwe ingredient</a>
  <table class="table table-striped">
    <thead>
      <tr>
        <th>Naam</th>
        <th>Acties</th>
      </tr>
    </thead>
    <tbody>
      {% for ing in ingredienten %}
        <tr>
          <td>{{ ing.ingredient }}</td>
          <td>
            <form method="post" action="{% url 'recepten:ingredient_delete' ing.id %}">
              {% csrf_token %}
              <button type="submit" class="btn btn-danger btn-sm">Verwijderen</button>
            </form>
          </td>
        </tr>
      {% empty %}
        <tr>
          <td colspan="2">Geen ingrediënten gevonden.</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
